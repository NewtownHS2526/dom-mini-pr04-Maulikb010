<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Penguin Slide Challenge</title>
  </head>

  <body>
    <div class="container">
      <h1>Penguin Slide Challenge</h1>

      <div class="section">
        <div class="lane">
          <button id="tux-button" value="tux">Slide!</button>
          <div class="track">
            <img id="tux-penguin" src="https://upload.wikimedia.org/wikipedia/commons/a/af/Tux.png" alt="tux penguin" />
          </div>
        </div>

        <div class="lane">
          <button id="daisy-button" value="daisy">Slide!</button>
          <div class="track">
            <img id="daisy-penguin" src="https://pngimg.com/d/pinguin_PNG7.png" alt="daisy penguin" />
          </div>
        </div>

        <div class="lane">
          <button id="rocky-button" value="rocky">Slide!</button>
          <div class="track">
            <img id="rocky-penguin" src="https://png.pngtree.com/png-vector/20220611/ourmid/pngtree-rockhopper-penguin-zoology-biology-aves-vector-png-image_36928294.png" alt="rocky penguin" />
          </div>
        </div>
      </div>

      <div id="winner"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
